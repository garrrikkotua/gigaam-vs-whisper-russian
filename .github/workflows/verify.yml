name: Verify archived benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify file checksums
        run: sha256sum -c CHECKSUMS.sha256
      - name: Recalculate corpus WER
        run: python3 verify.py
